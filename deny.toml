# cargo-deny configuration (R58).
#
# Four checks run: advisories (known vulnerabilities and unmaintained crates),
# licenses (every dependency must carry a licence from the allowlist), bans
# (duplicate or explicitly forbidden crates), and sources (crates may only
# come from crates.io).

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Anything copyleft or unknown fails the build.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # ring and aws-lc-sys (the TLS crypto behind rustls) carry OpenSSL-style
  # terms alongside ISC and Apache-2.0.
  "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # The tool is read-only and never needs a non-rustls TLS stack.
  { crate = "openssl" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
